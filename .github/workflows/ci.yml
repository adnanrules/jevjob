name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build -w @jevjob/web
      - run: npm test
      # The rules baseline needs no API key, so every change is scored on the eval set.
      - run: npm run eval -- rules
